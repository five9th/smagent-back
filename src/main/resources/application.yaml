spring:
  application:
    name: smagent
  datasource:
    url: jdbc:h2:file:./data/smagent;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update # Hibernate creates/alters tables to match @Entity classes at startup. Will need to switch to validate + migration scripts (Flyway).
    open-in-view: false
  h2:
    console:
      enabled: true

# For config readability's sake keep every param in this file and use imports only as overrides
  config:
    import:
      - "optional:file:/opt/smagent/config/deployment.yaml"  # deployment-specific configs (e.g. base URL, CORS origins)
      - "optional:file:/opt/smagent/config/secrets.yaml"     # secrets and platform app configs (e.g. IDs & secrets of platform apps)

server:
  servlet:
    session:
      cookie:
        http-only: true # JS don't see cookies
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info # only these two exist without auth (SecurityConfig)

smagent:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: http://localhost:8080
  admin:
    username: ${SMAGENT_ADMIN_USERNAME:admin}
    password: ${SMAGENT_ADMIN_PASSWORD:}
  security:
    encryption-key: ${SMAGENT_ENCRYPTION_KEY:}
    key-file: ./data/smagent.key
    log-password: false

  facebook:
    base-url: https://graph.facebook.com
    graph-api-version: v26.0
    callback-endpoint: /api/oauth/facebook/callback
    scope: "pages_show_list,pages_manage_posts,pages_read_engagement"

    client-id: ${FACEBOOK_CLIENT_ID}
    client-secret: ${FACEBOOK_CLIENT_SECRET}

  reddit:
    base-url: https://oauth.reddit.com
    token-url: https://www.reddit.com/api/v1/access_token

  linkedin:
    base-url: https://api.linkedin.com
    api-version: 202609
    callback-endpoint: /api/oauth/linkedin/callback
    scope-personal: "openid profile w_member_social"
    scope-company: "rw_organization_admin w_organization_social"

    client-id: ${LINKEDIN_CLIENT_ID}
    client-secret: ${LINKEDIN_CLIENT_SECRET}

  x:
    base-url: https://api.x.com
    authorize-url: https://x.com/i/oauth2/authorize
    callback-endpoint: /api/oauth/x/callback
    scope: "tweet.read tweet.write users.read offline.access"

    client-id: ${X_CLIENT_ID}
    client-secret: ${X_CLIENT_SECRET}