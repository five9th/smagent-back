# Profile for Spring-based tests: in-memory DB, throwaway key file —
# keeps tests from touching ./data (the real H2 database and encryption key).
# The random DB name isolates each Spring context (different @MockitoBean sets
# produce different cached contexts; a shared named DB would let their
# create-drop cycles interfere).
spring:
  datasource:
    url: jdbc:h2:mem:smagent-${random.uuid};DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: false

smagent:
  base-url: "" # OAuth redirect targets stay path-only, independent of APP_BASE_URL
  admin:
    username: test-owner
    password: test-password
  security:
    key-file: ./build/test-data/smagent.key
  linkedin:
    # pinned so OAuth tests don't depend on LINKEDIN_* env vars being unset
    client-id: test-client-id
    client-secret: test-client-secret
  x:
    # same reason as linkedin above
    client-id: test-client-id
    client-secret: test-client-secret
  facebook:
    # same reason as linkedin above
    client-id: test-client-id
    client-secret: test-client-secret
